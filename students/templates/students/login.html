<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #70c0b4;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .login-box p {
            text-align: center;
            margin-bottom: 30px;
            color: #777;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #70c0b4;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #70c0b4;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #4da99c;
        }

        .error {
            background: #ffe0e0;
            color: red;

            padding: 10px;

            margin-bottom: 20px;

            border-radius: 5px;

            text-align: center;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>Student Management</h1>

        <p>Login to continue</p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>

    </div>


</body>

</html>
