{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <div class="container">

        <div class="form-card">

            {% if student %}
                <h1>Edit Student</h1>
            {% else %}
                <h1>Add Student</h1>
            {% endif %}


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <div class="form-buttons">

                    <button type="submit" class="btn btn-success">
                        {% if student %}
                            Update Student
                        {% else %}
                            Save Student
                        {% endif %}
                    </button>


                    <a href="{% url 'dashboard' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
