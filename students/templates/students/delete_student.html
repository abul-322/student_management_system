<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Delete Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 50px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h2 {
            color: #dc3545;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #bb2d3b;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Delete Student</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>

        <a href="{% url 'student_list' %}" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
